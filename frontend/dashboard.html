
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | QualiTrack</title>

    <link rel="stylesheet" href="css/dashboard/layout.css">
    <link rel="stylesheet" href="css/dashboard/sidebar.css">
    <link rel="stylesheet" href="css/dashboard/header.css">
    <link rel="stylesheet" href="css/dashboard/overview.css">
</head>

<body>

    <div class="dashboard-layout">

        <!-- SIDEBAR COMPONENT -->
        <div id="sidebar-container"></div>

        <!-- MAIN AREA -->
        <div class="main-area">

            <!-- HEADER COMPONENT -->
            <div id="header-container"></div>

            <!-- FEATURE CONTENT -->
            <main id="dashboard-content">

                <div class="welcome-section">
                    <span class="welcome-label">QUALITRACK WORKSPACE</span>

                    <h1>Welcome to QualiTrack</h1>

                    <p>
                        Your software quality analytics workspace
                        starts here.
                    </p>
                </div>

                <div class="empty-dashboard">
                    <div class="empty-icon">Q</div>
                    <h2>Your dashboard is ready</h2>
                    <p>
                        We will build each dashboard feature
                        separately and connect it here.
                    </p>
                </div>

            </main>

        </div>

    </div>

    <script type="module" src="js/dashboard/dashboard.js"></script>

</body>
</html>
